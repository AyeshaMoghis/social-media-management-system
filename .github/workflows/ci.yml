name: CI Pipeline (Flask SQLite API)

on:
  push:
    branches:
      - 'dev'
      - 'feature/*'
  pull_request:
    branches:
      - 'dev'

jobs:
  # =============================
  # 1️⃣ BUILD STAGE
  # =============================
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify build
        run: |
          echo "Verifying Flask API build..."
          python -m compileall src || exit 1
          echo "✅ Build completed successfully."

  # =============================
  # 2️⃣ TEST STAGE (SQLite)
  # =============================
  test:
    name: Test Stage (SQLite)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (SQLite)
        env:
          TESTING: true
          DATABASE_URL: sqlite:///:memory:
        run: |
          echo "Running tests using SQLite..."
          pytest --maxfail=1 --disable-warnings -q

  # =============================
  # 3️⃣ COVERAGE STAGE
  # =============================
  coverage:
    name: Coverage Stage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run coverage
        run: |
          echo "Running coverage analysis..."
          coverage run -m pytest
          coverage report -m --fail-under=75
          coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # =============================
  # 4️⃣ LINT STAGE
  # =============================
  lint:
    name: Lint Stage
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run pylint checks
        run: |
          pip install pylint bc
          echo "Running pylint..."
          pylint src/ --exit-zero > pylint-report.txt
          score=$(tail -n 2 pylint-report.txt | grep -o '[0-9]*\.[0-9]*' | tail -1)
          echo "Pylint score: $score"
          if (( $(echo "$score < 7.5" | bc -l) )); then
            echo "❌ Lint score below threshold (7.5)"
            exit 1
          fi

      - name: Upload pylint report
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt

  # =============================
  # 5️⃣ SECURITY STAGE
  # =============================
  security:
    name: Security Stage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Bandit scan
        run: |
          pip install bandit
          echo "Running Bandit security scan..."
          bandit -r . -f html -o bandit-report.html || true

      - name: Run dependency audit
        run: |
          pip install pip-audit
          echo "Running pip-audit for dependencies..."
          pip-audit -r requirements.txt -f json > dependency-audit.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.html
            dependency-audit.json
