name: CI Pipeline (Sprint 1)

on:
  push:
    branches:
      - 'dev'
      - 'feature/*'
  pull_request:
    branches:
      - 'dev'

jobs:
  # =============================
  # 1️⃣ BUILD STAGE
  # =============================
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  # =============================
  # 2️⃣ TEST STAGE
  # =============================
  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          echo "Running tests..."
          if [ -f pytest.ini ] || [ -d tests ]; then pytest --maxfail=5 --disable-warnings -q; else echo "No tests found."; fi

  # =============================
  # 3️⃣ COVERAGE STAGE
  # =============================
  coverage:
    name: Coverage Stage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run coverage
        run: |
          echo "Running coverage check..."
          if [ -d tests ]; then coverage run -m pytest; coverage report -m; else echo "No tests found for coverage."; fi

