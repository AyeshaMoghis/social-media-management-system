[pytest]
# Pytest configuration for SMMS testing (corrected for src/ structure)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test_intg2

# Coverage options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=75

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    oauth: OAuth flow tests
    publishing: Platform publishing tests

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv uploads src/__pycache__ test_intg2/__pycache__

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S