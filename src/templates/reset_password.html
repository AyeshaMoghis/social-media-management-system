<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | SMMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <div class="container">

    <div class="left-panel">
      <h1>Create a new password 🔒</h1>
      <p>Choose something strong and secure.</p>
    </div>

    <div class="right-panel">

      <!-- Toast -->
      <div class="toast-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="toast toast-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>

      <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form">
        <h2>Reset Password</h2>

        <div class="password-wrapper">
          <input type="password" id="new_password" name="password" placeholder="New password" required>
          <span id="togglePassword" class="toggle-eye">👁️</span>
        </div>

        <div id="strengthBar" class="strength-bar"></div>
        <p id="strengthText"></p>

        <button type="submit">Save New Password</button>
      </form>

    </div>
  </div>

  <!-- Toggle -->
  <script>
    document.getElementById("togglePassword").addEventListener("click", () => {
      const f = document.getElementById("new_password");
      f.type = f.type === "password" ? "text" : "password";
    });
  </script>

  <!-- Strength Meter -->
  <script>
    document.getElementById("new_password").addEventListener("input", (e) => {
      const pwd = e.target.value;
      let score = 0;

      if (pwd.length >= 8) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;

      const bar = document.getElementById("strengthBar");
      const t = document.getElementById("strengthText");

      if (score <= 1) { bar.style.background = "red"; t.textContent = "Weak"; }
      else if (score <= 3) { bar.style.background = "orange"; t.textContent = "Medium"; }
      else { bar.style.background = "green"; t.textContent = "Strong"; }
    });
  </script>

  <!-- Toast auto-remove -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".toast").forEach(t => {
        setTimeout(() => t.classList.add("hide"), 3000);
        setTimeout(() => t.remove(), 3500);
      });
    });
  </script>

</body>
</html>
